<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ DarkForge AI Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #00ff88;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Matrix Rain Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00ccff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 2px;
        }

        header .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
            font-family: 'Fira Code', monospace;
        }

        header .subtitle span {
            color: #00ff88;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888;
            font-size: 0.9em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Chat Container */
        .chat-container {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            padding: 15px 20px;
            background: rgba(0, 255, 136, 0.05);
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .title {
            font-weight: 700;
            color: #00ff88;
        }

        .chat-header .model-select {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9em;
            cursor: pointer;
        }

        .chat-header .model-select option {
            background: #0a0a0f;
            color: #00ff88;
        }

        /* Messages */
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.2);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .message .msg-header .name {
            font-weight: 700;
            font-size: 0.85em;
        }

        .message .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .message.user {
            text-align: left;
        }

        .message.user .msg-content {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.15);
            color: #e0e0e0;
            display: inline-block;
            max-width: 80%;
        }

        .message.ai .msg-content {
            background: rgba(0, 204, 255, 0.05);
            border: 1px solid rgba(0, 204, 255, 0.1);
            color: #ccc;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
        }

        .message.ai .name {
            color: #00ccff;
        }

        .message.user .name {
            color: #00ff88;
        }

        .typing-indicator {
            display: none;
            padding: 10px 20px;
            color: #666;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            animation: blink 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            border-top: 1px solid rgba(0, 255, 136, 0.1);
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: #00ff88;
            font-family: 'Fira Code', monospace;
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #00ff88;
        }

        .input-area input::placeholder {
            color: #444;
        }

        .input-area button {
            background: linear-gradient(135deg, #00ff88, #00ccff);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            color: #0a0a0f;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid rgba(0, 255, 136, 0.05);
            flex-wrap: wrap;
        }

        .quick-btn {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            padding: 8px 14px;
            color: #888;
            font-size: 0.85em;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
            color: #00ff88;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            color: #333;
            font-size: 0.85em;
        }

        footer a {
            color: #00ff88;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 2em; }
            .status-bar { gap: 15px; font-size: 0.85em; }
            .message.user .msg-content { max-width: 100%; }
            .input-area { flex-direction: column; }
            .input-area button { width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <h1>☠️ DarkForge</h1>
            <div class="subtitle">AI Terminal — <span>v1.0</span></div>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="server-status"></div>
                <span id="server-text">Checking server...</span>
            </div>
            <div class="status-item">
                <span>🔌</span>
                <span id="model-text">Model: —</span>
            </div>
            <div class="status-item">
                <span>⚡</span>
                <span id="response-time">0ms</span>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <span class="title">💬 Terminal Chat</span>
                <select class="model-select" id="model-select">
                    <option value="llama3.2:1b">🦙 Llama 3.2 (1B)</option>
                    <option value="mistral:7b">🌪️ Mistral (7B)</option>
                    <option value="codellama:7b">💻 CodeLlama (7B)</option>
                </select>
            </div>

            <div class="messages" id="messages">
                <div class="message ai">
                    <div class="msg-header">
                        <span class="name">☠️ DarkForge</span>
                    </div>
                    <div class="msg-content">
                        > System initialized.<br>
                        > AI models ready.<br>
                        > Ask me anything.
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typing">
                <span>●</span><span>●</span><span>●</span> DarkForge is thinking...
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autofocus>
                <button id="send-btn" onclick="sendMessage()">➤ أرسل</button>
            </div>

            <div class="quick-actions">
                <button class="quick-btn" onclick="quickPrompt('اكتب لي قصة قصيرة')">📝 قصة</button>
                <button class="quick-btn" onclick="quickPrompt('اشرح لي concept برمجي')">💻 شرح</button>
                <button class="quick-btn" onclick="quickPrompt('ساعدني في debugging')">🐛 Debug</button>
                <button class="quick-btn" onclick="quickPrompt('اكتب لي كود Python')">🐍 كود</button>
            </div>
        </div>

        <footer>
            ☠️ DarkForge AI Terminal — <a href="https://github.com/gg4877399-max/darkforge-ai-terminal" target="_blank">GitHub</a>
        </footer>
    </div>

    <script>
        // --- Matrix Rain ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789<>/{}[]|&^%$#@!';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillStyle = Math.random() > 0.98 ? '#fff' : '#00ff88';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- Chat Logic ---
        const OLLAMA_HOST = window.location.origin.replace(':5500', ':11434').replace(':8080', ':11434');
        let selectedModel = 'llama3.2:1b';

        document.getElementById('model-select').addEventListener('change', (e) => {
            selectedModel = e.target.value;
        });

        // Check server status
        async function checkServer() {
            const statusDot = document.getElementById('server-status');
            const statusText = document.getElementById('server-text');
            const modelText = document.getElementById('model-text');

            try {
                const res = await fetch(`${OLLAMA_HOST}/api/tags`);
                if (res.ok) {
                    const data = await res.json();
                    statusDot.className = 'status-dot';
                    statusText.textContent = '🟢 Server Online';
                    const models = data.models || [];
                    modelText.textContent = `📦 Models: ${models.length} loaded`;
                } else {
                    throw new Error('Server offline');
                }
            } catch (e) {
                statusDot.className = 'status-dot offline';
                statusText.textContent = '🔴 Server Offline';
                modelText.textContent = '⚠️ Connect to server';
            }
        }

        checkServer();
        setInterval(checkServer, 10000);

        // Send message
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            addMessage('user', msg);
            document.getElementById('typing').classList.add('active');
            document.getElementById('send-btn').disabled = true;

            const startTime = Date.now();

            try {
                const res = await fetch(`${OLLAMA_HOST}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: selectedModel,
                        prompt: msg,
                        stream: false
                    })
                });

                const elapsed = Date.now() - startTime;
                document.getElementById('response-time').textContent = `${elapsed}ms`;

                if (res.ok) {
                    const data = await res.json();
                    addMessage('ai', data.response || '...');
                } else {
                    addMessage('ai', '⚠️ Error: ' + res.status + ' - تأكد من تشغيل Ollama على السيرفر');
                }
            } catch (e) {
                document.getElementById('response-time').textContent = 'ERR';
                addMessage('ai', '⚠️ Connection failed. شغّل الأمر: ollama serve');
            }

            document.getElementById('typing').classList.remove('active');
            document.getElementById('send-btn').disabled = false;
        }

        function addMessage(type, content) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerHTML = `
                <div class="msg-header">
                    <span class="name">${type === 'ai' ? '☠️ DarkForge' : '👤 You'}</span>
                </div>
                <div class="msg-content">${content.replace(/\n/g, '<br>')}</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function quickPrompt(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        // Enter to send
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
